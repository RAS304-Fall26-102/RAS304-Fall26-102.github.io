
site_name: RAS304 | Team 102
site_url: https://ras304-fall26-102.github.io/
repo_url: https://github.com/RAS304-Fall26-102/RAS304-Fall26-102.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: custom_theme/

  palette:
    - scheme: default
      primary: custom
      accent: custom

  font:
    text: Roboto
    code: Roboto Mono

  logo: static/logo304.svg
  favicon: static/logo304.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.code.copy

nav:
  - Home: index.md
  - Team Organization: 02-Team-Organization.md
  - User Needs and Benchmarking: 03-User-Needs-and-Benchmarking.md
  - Product Requirements: 04-Product-Requirements.md
  - Design Ideation: 05-design-ideation.md
  - Team Block Diagram: 06-team-block-diagram.md
  - Software Proposal: "07-Software Proposal.md"
  - Brainstorming Process: brainstorming-process.md

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  static

copyright: "RAS304 Team 102 | Robotics and Autonomous Systems"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: https://github.com/RAS304-Fall26-102/RAS304-Fall26-102.github.io
      name: Team 102 GitHub Repository
